<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qiaowei Wang</title>
  <meta name="description" content="Qiaowei Wang: projects built in public.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg:#fbf7f0; --surface:#fff; --text:#2a2420; --muted:#6b6159; --border:#e6dccd; --accent:#c8452c; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1b1815; --surface:#24201c; --text:#f1ebe3; --muted:#b3a89c; --border:#3a332c; --accent:#ff7a5c; color-scheme: dark; } }
    :root[data-theme="dark"] { --bg:#1b1815; --surface:#24201c; --text:#f1ebe3; --muted:#b3a89c; --border:#3a332c; --accent:#ff7a5c; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:17px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
    main { max-width:640px; margin:0 auto; padding:72px 20px 48px; }
    h1 { font-size:clamp(2rem,6vw,2.8rem); letter-spacing:-.02em; margin:0 0 8px; }
    .sub { color:var(--muted); margin:0 0 40px; }
    h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 12px; }
    .project { display:flex; gap:16px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 20px; color:inherit; text-decoration:none; }
    .project:hover { border-color:var(--accent); }
    .project img { flex:none; }
    .project strong { display:block; font-size:1.1rem; }
    .project span { color:var(--muted); font-size:.95rem; }
    .links { margin-top:40px; display:flex; gap:20px; font-size:.95rem; }
    a { color:var(--accent); }
    footer { color:var(--muted); font-size:.85rem; margin-top:56px; }
  </style>
</head>
<body>
  <main>
    <h1>Qiaowei Wang</h1>
    <p class="sub">Projects I build in public.</p>

    <h2>Projects</h2>
    <a class="project" href="https://robo.qiaowei.wang">
      <img src="favicon.svg" alt="" width="44" height="44">
      <div>
        <strong>Robo Orders Pizza</strong>
        <span>Sign-in, certificates, secrets and directories, made something you can click: a robot orders pizza for a class party.</span>
      </div>
    </a>

    <div class="links">
      <a href="https://github.com/Biubiuwang123" rel="noopener">GitHub</a>
    </div>

    <footer>© 2026 Qiaowei Wang</footer>
  </main>
</body>
</html>
